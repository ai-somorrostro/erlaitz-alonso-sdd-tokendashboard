<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador de modelos de lenguaje</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecera-pagina">
    <h1>Comparador de modelos de lenguaje</h1>
    <p class="aviso-datos">Datos de prueba: precios, TTFT y consumo son ficticios y no reflejan valores reales.</p>
  </header>

  <main class="contenido">
    <div class="barra-filtros" role="group" aria-label="Filtros de la tabla">
      <div class="campo-filtro">
        <label class="etiqueta-filtro" for="filtro-nombre">Buscar modelo</label>
        <input type="text" id="filtro-nombre" class="control-filtro" placeholder="Nombre del modelo" autocomplete="off">
      </div>
      <div class="campo-filtro">
        <label class="etiqueta-filtro" for="filtro-in">Modalidad de entrada</label>
        <select id="filtro-in" class="control-filtro">
          <option value="todas">Todas</option>
        </select>
      </div>
      <div class="campo-filtro">
        <label class="etiqueta-filtro" for="filtro-out">Modalidad de salida</label>
        <select id="filtro-out" class="control-filtro">
          <option value="todas">Todas</option>
        </select>
      </div>
      <button type="button" id="limpiar-filtros" class="boton-filtro">Limpiar</button>
      <span id="contador-modelos" class="contador-modelos" aria-live="polite"></span>
    </div>

    <div class="tabla-contenedor">
      <table class="tabla-modelos" id="tabla-modelos"></table>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
