<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador de modelos de lenguaje</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecera-pagina">
    <h1>Comparador de modelos de lenguaje</h1>
    <p class="aviso-datos">Datos de prueba: precios, TTFT y consumo son ficticios y no reflejan valores reales.</p>
  </header>

  <main class="contenido">
    <div class="leyenda" id="leyenda" aria-label="Leyenda de modalidades"></div>

    <div class="tabla-contenedor">
      <table class="tabla-modelos" id="tabla-modelos"></table>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
